name: dsh-course-scope
services:
  gateway:
    build:
      context: ../..
      dockerfile: course/scope-runtime/Dockerfile.gateway
    cap_drop: [ALL]
    cap_add: [NET_ADMIN, NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    read_only: true
    volumes:
      - ./scope.json:/etc/course/scope.json:ro
      - course-ca:/run/course-public
    tmpfs:
      - /run/course-private:mode=0700
      - /tmp
    healthcheck:
      test: [CMD, python3, /opt/course/gateway.py, --health]
      interval: 2s
      timeout: 2s
      retries: 20
    restart: "no"
  research:
    build:
      context: ../..
      dockerfile: course/scope-runtime/Dockerfile.research
      target: harness
      args:
        DSH_CLIENT_COMMIT_HASH: ${DSH_CLIENT_COMMIT_HASH:-}
    user: "1000:1000"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    network_mode: service:gateway
    depends_on:
      gateway:
        condition: service_healthy
    read_only: true
    shm_size: 1gb
    environment:
      HOME: /home/course
      DSH_HOME: /home/course/.dsh
      NARB_NATIVE_CACHE_DIR: /home/course/.cache/dsh-native
      DSH_TELEMETRY_MODE: DISABLED
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      HTTP_PROXY: http://127.0.0.1:3128
      HTTPS_PROXY: http://127.0.0.1:3128
      ALL_PROXY: http://127.0.0.1:3128
      http_proxy: http://127.0.0.1:3128
      https_proxy: http://127.0.0.1:3128
      all_proxy: http://127.0.0.1:3128
      NO_PROXY: ""
      no_proxy: ""
      NODE_EXTRA_CA_CERTS: /run/course-public/ca.crt
      SSL_CERT_FILE: /run/course-public/combined.pem
      REQUESTS_CA_BUNDLE: /run/course-public/combined.pem
      CURL_CA_BUNDLE: /run/course-public/combined.pem
    volumes:
      - course-ca:/run/course-public:ro
      - course-home:/home/course
      - course-workspace:/workspace
      - ./resolv.conf:/etc/resolv.conf:ro
    tmpfs:
      - /tmp:mode=1777
    stdin_open: true
    tty: true
volumes:
  course-ca:
  course-home:
  course-workspace:
