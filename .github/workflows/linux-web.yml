name: Linux web adapters
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  linux:
    name: Linux web adapters
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install Linux prerequisites
        run: |
          npm install --global pnpm@10.32.1
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential bubblewrap curl zip unzip dbus-x11 gnome-keyring libsecret-tools python3-venv
          bwrap --unshare-all --ro-bind / / -- /bin/true
      - name: Prepare pinned source and dependencies
        run: |
          pnpm bootstrap
          npx --yes pnpm@11.28.5 --dir vendor/deepseek-harness install --frozen-lockfile --ignore-scripts
          pnpm install --frozen-lockfile
          node packages/browser/node_modules/playwright/cli.js install --with-deps chromium
      - name: Build distribution and web harness
        run: |
          pnpm typecheck
          pnpm build:harness
          pnpm build
          pnpm setup:tools --only recon
          pnpm setup:tools --only rea
          pnpm setup:tools --only ffuf
          pnpm setup:tools --only learning
      - name: Check confined adapters with local fixtures
        env:
          DSH_TEST_WEB_UI: '1'
          DSH_TEST_RECON_CONFIG: ${{ github.workspace }}/.pentest/tooling.json
          DSH_TEST_FFUF: ${{ github.workspace }}/.pentest/toolchains/ffuf/2.3.0/linux-x64/ffuf
          DSH_TEST_OPTUNA_PYTHON: ${{ github.workspace }}/.pentest/toolchains/optuna/bin/python
          DSH_TEST_REA_ROOT: ${{ github.workspace }}/.pentest/toolchains/rea/node_modules/rea-agents
          DSH_TEST_REA_NODE: ${{ github.workspace }}/.pentest/toolchains/rea-node/24.22.1/linux-x64/bin/node
        run: |
          pnpm exec vitest run tests/fuzz.test.ts tests/worker.test.ts tests/linux-platform.test.ts tests/secret-service.test.ts tests/browser.test.ts tests/toolchain-setup.test.ts tests/ffuf-setup.test.ts tests/rea-setup.test.ts tests/rea.test.ts tests/rea-linux.test.ts tests/learning.test.ts tests/issue-regressions.test.ts tests/additive-modes.test.ts tests/profile.test.ts tests/model-egress.test.ts tests/policy.test.ts tests/review.test.ts tests/replay.test.ts tests/orchestration.test.ts tests/web-issues.test.ts packages/dsh-plugin/src/integration.test.ts
      - name: Check Secret Service in a disposable session
        run: |
          dbus-run-session -- sh -eu -c '
            printf "%s" "synthetic-ci-keyring-password" | gnome-keyring-daemon --unlock --components=secrets
            DSH_TEST_SECRET_SERVICE=1 pnpm exec vitest run tests/secret-service.test.ts
          '
      - name: Check loopback web startup without a model call
        run: |
          DSH_PENTEST_PORT=19876 pnpm web > "$RUNNER_TEMP/djupleita-web.log" 2>&1 &
          web_pid=$!
          trap 'kill "$web_pid" 2>/dev/null || true' EXIT
          node scripts/check-web.mjs "$RUNNER_TEMP/djupleita-web.log" 19876

  macos:
    name: macOS compatibility
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Prepare pinned source and dependencies
        run: |
          npm install --global pnpm@10.32.1
          pnpm bootstrap
          npx --yes pnpm@11.28.5 --dir vendor/deepseek-harness install --frozen-lockfile --ignore-scripts
          pnpm install --frozen-lockfile
          node packages/browser/node_modules/playwright/cli.js install chromium
      - name: Build distribution and web harness
        run: |
          pnpm typecheck
          pnpm build:harness
          pnpm build
          pnpm setup:tools --only recon
      - name: Check shared modes, approvals, replay and web controls
        env:
          DSH_TEST_WEB_UI: '1'
          DSH_TEST_RECON_CONFIG: ${{ github.workspace }}/.pentest/tooling.json
        run: |
          pnpm exec vitest run tests/issue-regressions.test.ts tests/additive-modes.test.ts tests/profile.test.ts tests/model-egress.test.ts tests/policy.test.ts tests/review.test.ts tests/replay.test.ts tests/orchestration.test.ts tests/web-issues.test.ts tests/browser.test.ts tests/worker.test.ts tests/toolchain-setup.test.ts tests/ffuf-setup.test.ts tests/rea-setup.test.ts tests/secret-service.test.ts packages/dsh-plugin/src/integration.test.ts
