name: Secret protection
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'
permissions:
  contents: read
jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DJUPLEITA_CONFIDENTIAL_REFERENCES: ${{ secrets.DJUPLEITA_CONFIDENTIAL_REFERENCES }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install checksum-pinned scanner
        run: node scripts/security/install.mjs
      - name: Install local screenshot OCR
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng
      - name: Test secret guard
        run: node --test scripts/security/scan.test.mjs
      - name: Scan outgoing commits
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if test "$EVENT_NAME" = pull_request || test "$BASE" != 0000000000000000000000000000000000000000; then
            node scripts/security/scan.mjs range "$BASE..$HEAD"
          else
            node scripts/security/scan.mjs history "$HEAD"
          fi
      - name: Scan complete reachable history
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: node scripts/security/scan.mjs history
